name: setup-kubernetes
author: "The Flux Authors"
description: Setups Kubernetes Kind cluster and Docker BuildKit for Flux controller e2e testing
inputs:
  go-version:
    description: 'Go version to setup'
    required: true
  kind-version:
    description: 'Kind version to setup'
    required: false
    default: 'v0.32.0'
  cluster-name:
    description: 'Name of the kind cluster'
    required: false
    default: 'kind'
  kind-config:
    description: 'Path to a kind cluster configuration file (optional)'
    required: false
  skip-checkout:
    description: 'Skip checking out the repository (useful when the caller has already run checkout)  Example: generating kind-configs / spinning up multiple clusters'
    required: false
    default: 'false'
  skip-tools:
    description: 'Skip the toolchain setup steps (Kustomize, QEMU, Buildx, Go) and only create the kind cluster  Example: spinning up a second or third cluster after a first run of this action has already setup tools'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Checkout
      if: ${{ inputs.skip-checkout != 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Kustomize
      if: ${{ inputs.skip-tools != 'true' }}
      uses: fluxcd/pkg/actions/kustomize@4bf3ea935541baf8b254aa52aeff62335b563113 # main
    - name: Setup QEMU
      if: ${{ inputs.skip-tools != 'true' }}
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - name: Setup Docker Buildx
      id: buildx
      if: ${{ inputs.skip-tools != 'true' }}
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Setup Go
      if: ${{ inputs.skip-tools != 'true' }}
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: |
          **/go.sum
          **/go.mod
    - name: Setup Kubernetes
      uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
      with:
        version: ${{ inputs.kind-version }}
        cluster_name: ${{ inputs.cluster-name }}
        config: ${{ inputs.kind-config }}
